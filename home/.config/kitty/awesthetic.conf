# vim:ft=kitty

## name:     Awesthetic Pro - Dark Frosted
## author:   Saimoomedits (adapted for Kitty)
## license:  Copyleft © 2022
## blurb:    Dark frosted glass aesthetic matched to awesomewm theme

# The basic colors
foreground              #ccd0d9
background              #0F0F11
selection_foreground    #0F0F11
selection_background    #8AB4F8

# Cursor colors
cursor                  #8AB4F8
cursor_text_color       #0F0F11
cursor_shape            Underline
cursor_underline_thickness 1

# Window padding
window_padding_width    20

# URL underline color when hovering with mouse
url_color               #8AB4F8

# Kitty window border colors
active_border_color     #8AB4F8
inactive_border_color   #212125
bell_border_color       #F85E4D

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #0F0F11
active_tab_background   #8AB4F8
inactive_tab_foreground #ccd0d9
inactive_tab_background #1a1a1d
tab_bar_background      #0F0F11

# Colors for marks (marked text in the terminal)
mark1_foreground        #0F0F11
mark1_background        #8AB4F8
mark2_foreground        #0F0F11
mark2_background        #589979
mark3_foreground        #0F0F11
mark3_background        #F85E4D

# Background opacity (replaces alpha channels from awesomewm)
# Adjust 0.0-1.0 to taste. 0.9 = similar to #0F0F11EE
background_opacity      0.92

# The 16 terminal colors

# Black (derived from bg variants)
color0                  #1a1a1d
color8                  #212125

# Red
color1                  #9C474C
color9                  #F85E4D

# Green
color2                  #589979
color10                 #7ab89a

# Yellow (derived - warm accent to complement the palette)
color3                  #d4a85c
color11                 #f1cf8a

# Blue (accent)
color4                  #8AB4F8
color12                 #a8ccfa

# Magenta (derived - purple-ish to match the aesthetic)
color5                  #b48ead
color13                 #d4a6d0

# Cyan (derived - teal to bridge green and accent)
color6                  #6bb8d4
color14                 #8ad4f0

# White
color7                  #ccd0d9
color15                 #ebf0ff
