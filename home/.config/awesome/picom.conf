# --- Core & Performance ---
backend = "glx";
vsync = true;

# The holy grail for X11 resize stutter
xrender-sync-fence = true;

# Let it redraw everything to avoid damage-tracking overhead during springs
use-damage = false;

# Reduce stutter on workspace switch
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Smooth animations
transition-length = 200;
transition-step = 0.1;

# --- Fading (Smooth popups & dashboards) ---
# This makes your control centers fade in/out smoothly instead of instantly snapping
fading = true;
fade-in-step = 0.05; # (0.05 means it takes ~20 frames to fully appear)
fade-out-step = 0.05;
fade-delta = 5; # Delay between updates (ms)
no-fading-openclose = false; # Fade windows when opening/closing

# --- Shadows (Gives depth to popups) ---
# Drop shadows make floating dashboards/control centers look like they are floating above the bar
shadow = true;
shadow-radius = 20;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.5;
# Don't apply shadows to the main bar (adjust "awesome" if your wm class is different)
shadow-exclude = [
    "class_g = 'awesome'"
];

# --- Dark Frosted Glass Blur ---
# --- Blur (Frosted Glass) ---
# Using flat syntax for maximum picom compatibility
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-frame = true;

# Exclude the crosshair and desktop from blur
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "window_type = 'splash'",
    "class_g = 'ghost_number'",
];

blur-background-include = [
    "class_g = 'kitty'",
    "class_g = 'gram'",
    "class_g = 'thunar'",
];

# --- Opacity Rules ---
# Make unfocused windows slightly transparent (optional, but looks great)
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- Spring Animations (Requires picom-jonaburg / picom-ft fork) ---
# If you are on standard picom, these lines are ignored harmlessly.
# If you are on the fork, these control window open/close physics!
animation-stiffness = 200;
animation-damping = 20;
animation-window-mass = 1.0;
animation-clamping = true;

# --- Exclusions ---
# Make sure popups, tooltips, and the bar don't get weird transparency rules applied to them
opacity-rule = [
    "0:_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_HIDDEN'"
];
